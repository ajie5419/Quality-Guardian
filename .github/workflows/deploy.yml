name: deploy

on:
  push:
    tags:
      - 'qgs-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Optional image tag override (e.g. 1.2.4)'
        required: false
        type: string
      deploy_only:
        description: 'Skip image build/push and only run Deploy to ECS'
        required: false
        default: false
        type: boolean

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      IMAGE_REPO: ${{ secrets.ACR_REGISTRY }}/ajie5419/qms
      ECS_USER: ${{ secrets.ECS_USER || 'root' }}
      COMPOSE_FILE: /opt/qms/docker-compose.yml
      HEALTH_URL: http://127.0.0.1:3000/api/status
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare version
        id: version
        run: |
          REF_NAME="${GITHUB_REF_NAME}"
          EVENT="${GITHUB_EVENT_NAME}"
          INPUT_VERSION="${{ github.event.inputs.version || '' }}"
          DEPLOY_ONLY="${{ github.event.inputs.deploy_only || 'false' }}"

          if [ "$DEPLOY_ONLY" = "true" ] && [ -z "$INPUT_VERSION" ]; then
            echo "When deploy_only=true, 'version' is required."
            exit 1
          fi

          PKG_VERSION="$(node -p "require('./package.json').version")"

          if [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
            DISPLAY_VERSION="$INPUT_VERSION"
          elif [[ "$REF_NAME" == qgs-v* ]]; then
            VERSION="${REF_NAME#qgs-}"
            DISPLAY_VERSION="${REF_NAME#qgs-}"
          elif [[ "$REF_NAME" == v* ]]; then
            VERSION="$REF_NAME"
            DISPLAY_VERSION="$REF_NAME"
          else
            VERSION="v${PKG_VERSION}-${GITHUB_SHA::7}"
            DISPLAY_VERSION="v${PKG_VERSION}"
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "display_version=$DISPLAY_VERSION" >> "$GITHUB_OUTPUT"

      - name: Login ACR
        if: ${{ github.event.inputs.deploy_only != 'true' }}
        run: |
          echo "${{ secrets.ACR_PASSWORD }}" | docker login "${{ secrets.ACR_REGISTRY }}" \
            --username "${{ secrets.ACR_USERNAME }}" --password-stdin

      - name: Build backend image
        if: ${{ github.event.inputs.deploy_only != 'true' }}
        run: |
          docker build --platform linux/amd64 \
            -f infra/docker/Dockerfile.backend \
            -t "$IMAGE_REPO:backend-${{ steps.version.outputs.version }}" .

      - name: Build frontend image
        if: ${{ github.event.inputs.deploy_only != 'true' }}
        run: |
          docker build --platform linux/amd64 \
            -f infra/docker/Dockerfile.frontend \
            --build-arg VITE_APP_VERSION="${{ steps.version.outputs.display_version }}" \
            -t "$IMAGE_REPO:frontend-${{ steps.version.outputs.version }}" .

      - name: Push images
        if: ${{ github.event.inputs.deploy_only != 'true' }}
        run: |
          docker push "$IMAGE_REPO:backend-${{ steps.version.outputs.version }}"
          docker push "$IMAGE_REPO:frontend-${{ steps.version.outputs.version }}"

      - name: Copy bounded release executor to ECS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ env.ECS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: scripts/deploy/run-remote-release.sh
          target: /tmp/qms-release-executor
          strip_components: 2

      - name: Deploy to ECS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ env.ECS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          # 60 minutes exceeds the executor's 51-minute worst-case budget,
          # including preflight, guarded Prisma baseline/retry, and rollback.
          command_timeout: 60m
          script: |
            set -euo pipefail
            TAG='${{ steps.version.outputs.version }}'
            IMAGE_REPO='${{ env.IMAGE_REPO }}'
            COMPOSE_FILE='${{ env.COMPOSE_FILE }}'
            HEALTH_URL='${{ env.HEALTH_URL }}'

            if [ ! -f "$COMPOSE_FILE" ]; then
              ALT_COMPOSE_FILE="/opt/qms/infra/docker/docker-compose.yml"
              if [ -f "$ALT_COMPOSE_FILE" ]; then
                COMPOSE_FILE="$ALT_COMPOSE_FILE"
              else
                echo "compose file not found: $COMPOSE_FILE or $ALT_COMPOSE_FILE"
                exit 1
              fi
            fi

            chmod +x /tmp/qms-release-executor/run-remote-release.sh
            /tmp/qms-release-executor/run-remote-release.sh \
              --compose-file "$COMPOSE_FILE" \
              --backend-image "${IMAGE_REPO}:backend-${TAG}" \
              --frontend-image "${IMAGE_REPO}:frontend-${TAG}" \
              --version "$TAG" \
              --health-url "$HEALTH_URL"
