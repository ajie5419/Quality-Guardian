name: deploy

on:
  push:
    tags:
      - 'qgs-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Optional image tag override (e.g. 1.2.4)'
        required: false
        type: string
      deploy_only:
        description: 'Skip image build/push and only run Deploy to ECS'
        required: false
        default: false
        type: boolean
      skip_maintenance:
        description: 'Skip the release maintenance script (emergency restore)'
        required: false
        default: false
        type: boolean

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      IMAGE_REPO: ${{ secrets.ACR_REGISTRY }}/ajie5419/qms
      ECS_USER: ${{ secrets.ECS_USER || 'root' }}
      COMPOSE_FILE: /opt/qms/docker-compose.yml
      HEALTH_URL: http://127.0.0.1:3000/api/status
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare version
        id: version
        run: |
          REF_NAME="${GITHUB_REF_NAME}"
          EVENT="${GITHUB_EVENT_NAME}"
          INPUT_VERSION="${{ github.event.inputs.version || '' }}"
          DEPLOY_ONLY="${{ github.event.inputs.deploy_only || 'false' }}"
          SKIP_MAINTENANCE="${{ github.event.inputs.skip_maintenance || 'false' }}"

          if [ "$DEPLOY_ONLY" = "true" ] && [ -z "$INPUT_VERSION" ]; then
            echo "When deploy_only=true, 'version' is required."
            exit 1
          fi

          PKG_VERSION="$(node -p "require('./package.json').version")"

          if [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
            DISPLAY_VERSION="$INPUT_VERSION"
          elif [[ "$REF_NAME" == v* ]]; then
            VERSION="$REF_NAME"
            DISPLAY_VERSION="$REF_NAME"
          else
            VERSION="v${PKG_VERSION}-${GITHUB_SHA::7}"
            DISPLAY_VERSION="v${PKG_VERSION}"
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "display_version=$DISPLAY_VERSION" >> "$GITHUB_OUTPUT"
          echo "skip_maintenance=$SKIP_MAINTENANCE" >> "$GITHUB_OUTPUT"

      - name: Login ACR
        if: ${{ github.event.inputs.deploy_only != 'true' }}
        run: |
          echo "${{ secrets.ACR_PASSWORD }}" | docker login "${{ secrets.ACR_REGISTRY }}" \
            --username "${{ secrets.ACR_USERNAME }}" --password-stdin

      - name: Build backend image
        if: ${{ github.event.inputs.deploy_only != 'true' }}
        run: |
          docker build --platform linux/amd64 \
            -f infra/docker/Dockerfile.backend \
            -t "$IMAGE_REPO:backend-${{ steps.version.outputs.version }}" .

      - name: Build frontend image
        if: ${{ github.event.inputs.deploy_only != 'true' }}
        run: |
          docker build --platform linux/amd64 \
            -f infra/docker/Dockerfile.frontend \
            --build-arg VITE_APP_VERSION="${{ steps.version.outputs.display_version }}" \
            -t "$IMAGE_REPO:frontend-${{ steps.version.outputs.version }}" .

      - name: Push images
        if: ${{ github.event.inputs.deploy_only != 'true' }}
        run: |
          docker push "$IMAGE_REPO:backend-${{ steps.version.outputs.version }}"
          docker push "$IMAGE_REPO:frontend-${{ steps.version.outputs.version }}"

      - name: Deploy to ECS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ env.ECS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: true
          # This envelope must exceed the sum of the bounded migration,
          # maintenance, service restart, and health-check stages below.
          command_timeout: 45m
          script: |
            set -euo pipefail
            set -x
            TAG='${{ steps.version.outputs.version }}'
            IMAGE_REPO='${{ env.IMAGE_REPO }}'
            COMPOSE_FILE='${{ env.COMPOSE_FILE }}'
            HEALTH_URL='${{ env.HEALTH_URL }}'
            SKIP_MAINTENANCE='${{ steps.version.outputs.skip_maintenance }}'

            if [ ! -f "$COMPOSE_FILE" ]; then
              ALT_COMPOSE_FILE="/opt/qms/infra/docker/docker-compose.yml"
              if [ -f "$ALT_COMPOSE_FILE" ]; then
                COMPOSE_FILE="$ALT_COMPOSE_FILE"
              else
                echo "compose file not found: $COMPOSE_FILE or $ALT_COMPOSE_FILE"
                exit 1
              fi
            fi

            cp "$COMPOSE_FILE" "$COMPOSE_FILE.bak"
            rollback() {
              cp "$COMPOSE_FILE.bak" "$COMPOSE_FILE" || true
              docker compose -f "$COMPOSE_FILE" up -d redis backend frontend || true
            }
            trap 'echo "deploy failed, rolling back compose and containers"; rollback' ERR

            run_with_timeout() {
              local seconds="$1"
              shift
              if command -v timeout >/dev/null 2>&1; then
                timeout "$seconds" "$@"
              else
                "$@"
              fi
            }

            run_backend() {
              local seconds="$1"
              shift
              run_with_timeout "$seconds" docker compose -f "$COMPOSE_FILE" run --rm backend sh -lc "$1"
            }

            baseline_existing_prisma_schema() {
              echo "checking production schema before Prisma migration baseline"
              run_backend 300 "set -e; cd /app/apps/backend; $PRISMA_CMD db pull --print --schema '$PRISMA_SCHEMA' > /tmp/qms-introspection.prisma; require_model() { if ! grep -q \"^model \$1 {\" /tmp/qms-introspection.prisma; then echo \"required production table is missing: \$1\"; exit 1; fi; }; mark_applied() { local migration=\"\$1\"; local resolve_log=\"/tmp/qms-resolve-\${migration}.log\"; if $PRISMA_CMD migrate resolve --schema '$PRISMA_SCHEMA' --applied \"\$migration\" >\"\$resolve_log\" 2>&1; then cat \"\$resolve_log\"; return 0; fi; if grep -Eiq 'already (applied|recorded|resolved)|has already been applied' \"\$resolve_log\"; then cat \"\$resolve_log\"; echo \"migration already tracked: \$migration\"; return 0; fi; cat \"\$resolve_log\"; return 1; }; require_model after_sales; require_model quality_records; require_model quality_losses; require_model qms_inspection_requests; require_model supplier_score_snapshots; if ! grep -q '^  selfCheckDocuments ' /tmp/qms-introspection.prisma; then echo 'production schema is older than qgs-v0.10.2; refusing automatic baseline'; exit 1; fi; baseline_through='20260617000100_add_inspection_self_check_documents'; echo \"baselining migrations through \${baseline_through}\"; for migration in \$(ls -1 prisma/migrations | sort); do if [ \"\$migration\" = 'migration_lock.toml' ]; then continue; fi; if [ ! -d \"prisma/migrations/\$migration\" ]; then continue; fi; mark_applied \"\$migration\"; if [ \"\$migration\" = \"\$baseline_through\" ]; then exit 0; fi; done; echo \"baseline migration not found: \${baseline_through}\"; exit 1"
            }

            deploy_prisma_migrations() {
              local migration_log="/tmp/qms-migrate-deploy.log"
              if run_with_timeout 300 docker compose -f "$COMPOSE_FILE" run --rm backend sh -lc "$PRISMA_CMD migrate deploy --schema '$PRISMA_SCHEMA'" 2>&1 | tee "$migration_log"; then
                return 0
              fi

              if ! grep -q 'P3005' "$migration_log"; then
                return 1
              fi

              echo "Prisma migrate deploy reported P3005; baselining existing production schema and retrying migrate deploy"
              baseline_existing_prisma_schema
              run_backend 300 "$PRISMA_CMD migrate deploy --schema '$PRISMA_SCHEMA'"
            }

            PRISMA_CMD="/app/apps/backend/node_modules/.bin/prisma"
            PRISMA_SCHEMA="/app/apps/backend/prisma/schema.prisma"
            RELEASE_MAINTENANCE_CMD="cd /app/apps/backend && sh scripts/run-release-maintenance.sh"
            QUALITY_LOSS_BACKFILL_CMD="cd /app/apps/backend && /app/apps/backend/node_modules/.bin/tsx scripts/backfill-quality-loss-index.ts"
            QUALITY_LOSS_BACKFILL_CONTAINER="qms-quality-loss-backfill"

            echo "docker disk usage before cleanup"
            docker system df || true
            docker container prune -f || true
            docker image prune -af || true
            docker builder prune -af || true
            echo "docker disk usage after cleanup"
            docker system df || true

            sed -i.qms "/^  backend:/,/^  [^ ]/ s#^    image:.*#    image: ${IMAGE_REPO}:backend-${TAG}#" "$COMPOSE_FILE"
            sed -i.qms "/^  frontend:/,/^  [^ ]/ s#^    image:.*#    image: ${IMAGE_REPO}:frontend-${TAG}#" "$COMPOSE_FILE"
            rm -f "${COMPOSE_FILE}.qms"

            run_with_timeout 300 docker compose -f "$COMPOSE_FILE" pull backend frontend || { echo "image pull failed, rolling back"; rollback; exit 1; }
            run_with_timeout 120 docker compose -f "$COMPOSE_FILE" up -d redis
            run_with_timeout 120 docker compose -f "$COMPOSE_FILE" stop backend
            deploy_prisma_migrations || { echo "prisma migration failed, rolling back"; rollback; exit 1; }
            if [ "$SKIP_MAINTENANCE" != "true" ]; then
              run_backend 600 "$RELEASE_MAINTENANCE_CMD" || { echo "release maintenance failed, rolling back"; rollback; exit 1; }
            else
              echo "release maintenance skipped (skip_maintenance=true)"
            fi
            run_with_timeout 180 docker compose -f "$COMPOSE_FILE" up -d backend frontend || { echo "service startup failed, rolling back"; rollback; exit 1; }

            ok=0
            for _ in {1..30}; do
              if curl -sf "$HEALTH_URL" >/dev/null 2>&1; then
                ok=1
                break
              fi
              sleep 2
            done

            if [ "$ok" -ne 1 ]; then
              echo "healthcheck failed"
              rollback
              exit 1
            fi

            docker rm -f "$QUALITY_LOSS_BACKFILL_CONTAINER" >/dev/null 2>&1 || true
            docker compose -f "$COMPOSE_FILE" run --rm -d --name "$QUALITY_LOSS_BACKFILL_CONTAINER" backend sh -lc "$QUALITY_LOSS_BACKFILL_CMD"

            trap - ERR
            rm -f "$COMPOSE_FILE.bak"
