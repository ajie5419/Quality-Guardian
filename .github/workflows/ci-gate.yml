name: CI Gate

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-gate-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.detect.outputs.code }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect code changes
        id: detect
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            echo "Changed files: not evaluated for $EVENT_NAME"
            echo "code=true" | tee -a "$GITHUB_OUTPUT"
            exit 0
          fi

          changed_output="$(git diff --name-only "$BASE_SHA"...HEAD)"
          if [[ -z "$changed_output" ]]; then
            echo "Changed files: 0"
            echo "code=true" | tee -a "$GITHUB_OUTPUT"
            exit 0
          fi

          mapfile -t changed_files <<< "$changed_output"
          echo "Changed files: ${#changed_files[@]}"

          code=false
          for file in "${changed_files[@]}"; do
            if [[ ! "$file" =~ \.md$ && ! "$file" =~ ^docs/ && ! "$file" =~ ^LICENSE ]]; then
              code=true
              break
            fi
          done
          echo "code=$code" | tee -a "$GITHUB_OUTPUT"

  lint:
    name: Lint
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Restore lint cache
        uses: actions/cache@v4
        with:
          path: .lint-cache
          key: lint-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            lint-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            lint-${{ runner.os }}-
      - name: Run lint
        run: pnpm run lint

  typecheck:
    name: Typecheck
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Restore Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            turbo-${{ runner.os }}-
      - name: Run typecheck
        run: pnpm run check:type

  qms-arch:
    name: QMS Architecture Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run QMS architecture check
        run: pnpm run check:qms-arch:all
      - name: Run incremental QMS architecture check
        shell: bash
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          # PRs compare against their base; main pushes compare against the previous tip.
          if [[ ! "$BASE_REF" =~ ^[0-9a-f]{40}$ || "$BASE_REF" =~ ^0+$ ]]; then
            echo "::error::Missing or invalid incremental architecture base SHA"
            exit 1
          fi
          git merge-base --is-ancestor "$BASE_REF" HEAD
          pnpm run check:qms-arch -- --changed
      - name: Check documentation drift
        run: pnpm run check:docs-drift
      - name: Check metric governance
        run: pnpm run check:metric-governance

  unit-tests:
    name: Unit Tests (shard ${{ matrix.shard }}/2)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run unit tests
        run: pnpm run test:unit -- --shard=${{ matrix.shard }}/2

  unit-tests-required:
    name: Unit Tests
    needs: [changes, unit-tests]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check unit test result
        shell: bash
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          UNIT_TESTS_RESULT: ${{ needs.unit-tests.result }}
        run: |
          if [[ "$CHANGES_RESULT" != "success" ]]; then
            echo "Change detection did not succeed: $CHANGES_RESULT"
            exit 1
          fi
          if [[ "$UNIT_TESTS_RESULT" == "success" || "$UNIT_TESTS_RESULT" == "skipped" ]]; then
            echo "Unit tests result accepted: $UNIT_TESTS_RESULT"
            exit 0
          fi
          echo "Unit tests did not succeed: $UNIT_TESTS_RESULT"
          exit 1

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  prisma-migration:
    name: Prisma Migration Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check schema/migration in sync
        run: bash ./scripts/check-prisma-migration.sh "origin/${{ github.base_ref || 'main' }}"
